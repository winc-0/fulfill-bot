[project]
name = "zhifu"
version = "0.1.0"
description = "履约客服助手 — 有状态的仓配履约客服对话智能体"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["app", "app.api", "app.conf", "app.core", "app.dialogue",
            "app.actions", "app.flows", "app.infra", "app.tracks"]
